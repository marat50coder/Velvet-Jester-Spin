workflows:
  ios-release:
    name: iOS Release → App Store
    max_build_duration: 60
    instance_type: mac_mini_m2

    integrations:
      app_store_connect: Velvet Jester Spin Codemagic

    environment:
      groups:
        - code-signing
      flutter: 3.41.7
      xcode: latest
      cocoapods: default
      vars:
        BUNDLE_ID: com.velvetjester.spingame
        NSE_BUNDLE_ID: com.velvetjester.spingame.NotificationService
        APP_STORE_APPLE_ID: "6797920582"

    triggering:
      events:
        - push
      branch_patterns:
        - pattern: gray-part-ios
          include: true
        - pattern: ios-gray-part
          include: true

    scripts:
      - name: Disable Swift Package Manager
        # Podfile is the source of truth for iOS deps (Firebase + all
        # gray-flow SDKs ship via CocoaPods; the SpinMediaNotification
        # target explicitly links Firebase/Messaging in Podfile:42). Without
        # forcing SPM off Flutter ALSO adds SPM refs to Firebase at archive
        # time and Xcode fails with `Redefinition of module 'Firebase'`
        # followed by a cascade of `Unable to resolve module dependency`.
        script: |
          set -e
          flutter config --no-enable-swift-package-manager
          # Verify the flag stuck — the printed line MUST include
          # `enable-swift-package-manager: false` for the archive to succeed.
          flutter config | grep -i "swift-package-manager" || true
          # Purge any SPM state that a previous build on this CI runner
          # may have cached under $HOME or the checkout dir. Empty on a
          # fresh runner but cheap to force.
          rm -rf "$HOME/.swiftpm" 2>/dev/null || true
          rm -rf ios/Runner.xcworkspace/xcshareddata/swiftpm
          rm -rf build/ios/SourcePackages

      - name: Install Flutter dependencies
        script: flutter pub get

      - name: Install CocoaPods
        script: pod install
        working_directory: ios

      - name: Code signing & Build IPA
        script: |
          set -e
          keychain initialize
          app-store-connect fetch-signing-files "$BUNDLE_ID" \
            --type IOS_APP_STORE \
            --platform IOS \
            --create
          app-store-connect fetch-signing-files "$NSE_BUNDLE_ID" \
            --type IOS_APP_STORE \
            --platform IOS \
            --create
          keychain add-certificates
          # Re-assert SPM disabled RIGHT before the archive — belt AND
          # suspenders since the previous step is in a separate shell.
          flutter config --no-enable-swift-package-manager
          flutter build ios --release --no-codesign
          # If `flutter build ios` still injected SPM refs, tear them out
          # BEFORE xcode-project archives the workspace. Empty on a
          # correctly-configured build; the safety net catches the case
          # where the flag is a no-op on this Flutter/Codemagic combo.
          rm -rf build/ios/SourcePackages
          rm -rf ios/Runner.xcworkspace/xcshareddata/swiftpm
          xcode-project use-profiles
          xcode-project build-ipa \
            --workspace "ios/Runner.xcworkspace" \
            --scheme "Runner"

    artifacts:
      - build/ios/ipa/*.ipa
      - /tmp/xcodebuild_logs/*.log

    publishing:
      app_store_connect:
        auth: integration
        submit_to_testflight: false
        submit_to_app_store: false
