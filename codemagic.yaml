workflows:
  ios-release:
    name: iOS Release → App Store
    max_build_duration: 60
    instance_type: mac_mini_m2

    integrations:
      app_store_connect: Velvet Jester Spin Codemagic

    environment:
      groups:
        - code-signing
      flutter: 3.41.7
      xcode: latest
      cocoapods: default
      vars:
        BUNDLE_ID: com.velvetjester.spingame
        NSE_BUNDLE_ID: com.velvetjester.spingame.NotificationService
        APP_STORE_APPLE_ID: "6797920582"
        # Belt-and-braces disable of Swift Package Manager. Flutter 3.24+
        # honours this env var even when `flutter config` state was not
        # persisted on the CI VM (which is what happens on Codemagic +
        # Flutter 3.41.7 — the config file is not read by the flutter build
        # ipa sub-invocation that xcode-project build-ipa spawns). Without
        # it, `flutter build ipa` adds the firebase-ios-sdk SPM package on
        # top of the Firebase CocoaPod and the two collide with
        # "Redefinition of module 'Firebase'".
        FLUTTER_ENABLE_SWIFT_PACKAGE_MANAGER: "false"

    triggering:
      events:
        - push
      branch_patterns:
        - pattern: gray-part-ios
          include: true
        - pattern: ios-gray-part
          include: true

    scripts:
      # Firebase ships as a CocoaPod for the Runner target (via the
      # firebase_core / firebase_messaging plugin podspecs). Flutter 3.24+
      # enables Swift Package Manager globally by default, which then
      # auto-adds firebase-ios-sdk as an SPM package on top of the pod —
      # the two modules collide with "Redefinition of module 'Firebase'".
      # The env var in `environment.vars` is the primary switch; this line
      # is a redundancy for CI images that pin the feature to on regardless
      # of env. NSE (SpinMediaNotification) is Firebase-free — it downloads
      # rich-media attachments over URLSession, no pod, no SPM.
      - name: Disable Swift Package Manager (CocoaPods-only project)
        script: flutter config --no-enable-swift-package-manager

      - name: Install Flutter dependencies
        script: flutter pub get

      - name: Install CocoaPods
        script: pod install
        working_directory: ios

      - name: Code signing & Build IPA
        script: |
          keychain initialize
          app-store-connect fetch-signing-files "$BUNDLE_ID" \
            --type IOS_APP_STORE \
            --platform IOS \
            --create
          app-store-connect fetch-signing-files "$NSE_BUNDLE_ID" \
            --type IOS_APP_STORE \
            --platform IOS \
            --create
          keychain add-certificates
          # Two-step build: compile Dart unsigned first (this can rewrite
          # the Xcode project), then apply provisioning profiles and pack
          # the IPA. Bypasses `flutter build ipa` which auto-injects the
          # SPM integration step even after `--no-enable-swift-package-manager`
          # in some Flutter 3.4x combinations — the env var handles that.
          flutter build ios --release --no-codesign
          xcode-project use-profiles
          xcode-project build-ipa \
            --workspace "ios/Runner.xcworkspace" \
            --scheme "Runner"

    artifacts:
      - build/ios/ipa/*.ipa
      - /tmp/xcodebuild_logs/*.log

    publishing:
      app_store_connect:
        auth: integration
        submit_to_testflight: false
        submit_to_app_store: false
